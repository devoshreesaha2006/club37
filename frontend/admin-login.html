<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Club 37</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-panel">
    <div class="brand"><span class="brand-mark">37</span> CLUB</div>
    <p class="login-sub">ADMIN CONTROL CENTER</p>

    <form id="admin-login-form" novalidate>
      <div class="form-alert" id="login-alert"></div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">SIGN IN</button>
    </form>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
